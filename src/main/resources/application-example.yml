spring:
  application:
    name: spotflow-ticketing-system

  datasource:
    url: jdbc:mysql://localhost:3306/spotflow?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:your_db_username}
    password: ${DB_PASSWORD:your_db_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      #      ??????????????????????????
      simple:
        prefetch: 1
        acknowledge-mode: manual #默认是auto
        retry:
          enabled: true #开启重试机制
          max-attempts: 3 #最大尝试次数

    template:
      retry:
        enabled: true #开启超时重试机制
        multiplier: 2 #失败后下次的等待时常倍数
      mandatory: true
    connection-timeout: 1s #设置mq的连接超时时间
    publisher-confirm-type: correlated #开启生产者 confirm，并允许你通过 CorrelationData 关联每条消息
    publisher-returns: true #开启 return 机制


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:replace-this-with-a-strong-secret}
    expiration-millis: ${JWT_EXPIRATION_MILLIS:604800000}
    header: ${JWT_HEADER:authorization}

logging:
  level:
    root: INFO
    com.kl: INFO
